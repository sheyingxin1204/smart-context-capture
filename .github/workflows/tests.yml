name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\src"
          python -m unittest discover -s tests -v
      - name: Run release preflight
        run: |
          python -B scripts/sync_skill_runtime.py --check
          python -B scripts/check_release.py
      - name: Verify clean release build
        run: python -B scripts/build_release.py --output "$env:RUNNER_TEMP\smart-context-release.zip"
